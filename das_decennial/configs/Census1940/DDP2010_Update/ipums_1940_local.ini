# Runnable 1940 configuration for the DAS 2020 DHC production code release.
#
# This file INCLUDEs the 1940 config shipped in this release and leaves it
# untouched. HierarchicalConfigParser gives the including file precedence
# ("an included config file will include default values and they will then be
# overwritten by the file doing the including" --
# das_framework/ctools/hierarchical_configparser.py:23), so everything below
# is an override or an addition layered on top of ipums_1940.ini.
#
# WHY THIS FILE IS NEEDED
# -----------------------
# ipums_1940.ini predates the budget/strategy refactor in this release. Four
# options the engine now requires are absent from it, and each one aborts the
# run before any data is read:
#
#   [reader] input_data_vintage  -> NoOptionError   at das_setup.py:127
#   [budget] strategy            -> DASConfigError  at budget.py:402
#   [budget] query_ordering      -> DASConfigError  at optimizer_query_ordering.py:84
#   [budget] global_scale        -> NoOptionError   at budget.py:93
#
# A fifth problem is a mismatch rather than an omission: ipums_1940.ini gives
# seven geolevel_budget_prop values against the five geolevels it declares,
# which trips the assert at budget.py:420. See strategies_1940.py for why
# (that line was carried over from a seven-geolevel DHCP config).
#
# The strategy and ordering named here live in
# programs/strategies/strategies_1940.py, which documents which values were
# transcribed from ipums_1940.ini and which had to be reconstructed.
#
# INPUT PATHS
# -----------
# Set DAS_1940_INPUT and DAS_1940_OUTPUT in the environment, e.g.
#   export DAS_1940_INPUT=/data/ipums1940
#   export DAS_1940_OUTPUT=/data/das1940_out
# and put EXT1940USCB_AK.dat (or the full EXT1940USCB.dat) in DAS_1940_INPUT.

[DEFAULT]
INCLUDE=ipums_1940.ini


[geodict]
# Explicit even though it is already the default in configs/default.ini: with
# non_aian_spine the reader skips spine reconstruction entirely
# (table_reader.py:690), so no GRFC files are required for 1940.
spine: non_aian_spine


[reader]
# Required by das_setup.py:127. Only logged, and compared against 2010 solely
# inside the opt_spine / aian_spine branches, which non_aian_spine does not
# reach.
input_data_vintage: 1940

# das_setup.py:122 reads this with a default hardcoded in Python source,
# '${DAS_S3INPUTS}/2010-convert/grfc', and getconfig expands variables in its
# own default -- so an unset DAS_S3INPUTS raises KeyError there before the
# option is ever used. Set explicitly to a literal.
#
# GRFC files are only read when reconstructing the geographic spine, which
# happens in the opt_spine and aian_spine branches of table_reader.py. With
# spine = non_aian_spine the reader falls through to the no-op else at
# table_reader.py:690 and never touches this path. It is pointed somewhere
# obviously invalid on purpose: if any code ever does read it, the failure
# should be a local, legible one rather than a confusing S3 error.
grfc_path: /nonexistent/grfc-unused-with-non_aian_spine

# Start with the single-state extract; switch to EXT1940USCB.dat for a full run.
PersonData.path: $DAS_1940_INPUT/EXT1940USCB_AK.dat
UnitData.path: $DAS_1940_INPUT/EXT1940USCB_AK.dat


[budget]
# pure DP with the geometric mechanism. These are already the engine defaults
# (budget.py:32-33); stated explicitly so the run is self-describing and so a
# future change of default cannot silently alter the privacy semantics.
privacy_framework: pure_dp
dp_mechanism: geometric_mechanism

# ipums_1940.ini asks for epsilon_budget_total = 4.0, which this release no
# longer reads (only programs/experiment/experiment.py:41 does). Under pure DP
# the engine derives total epsilon as 1 / global_scale (budget.py:224), so
# global_scale = 1/4 reproduces the requested total epsilon of 4.
global_scale: 1/4

# Uniform across the five 1940 geolevels, in topdown order
# (National, State, County, Supdist, Enumdist -- budget.py:419 reverses
# geolevel_names before zipping). Replaces the seven-value line inherited from
# ipums_1940.ini. See strategies_1940.py for the rationale.
geolevel_budget_prop: 1/5, 1/5, 1/5, 1/5, 1/5

strategy: strategy_1940
query_ordering: strategy_1940_regular_ordering


[environment]
# Identifier for this run. Required, and not supplied by the standalone driver.
#
# optimizer.py:216 and :419 do
#
#     try:
#         os.environ[CC.DAS_RUN_UUID] = self.getconfig(CC.DAS_RUN_UUID,
#                                                      section=CC.ENVIRONMENT_SECTION)
#     except NoSectionError:
#         os.environ[CC.DAS_RUN_UUID] = "NO_DAS_RUN_UUID"
#
# which catches NoSectionError but not NoOptionError. The [environment] section
# does exist here (inherited from ipums_1940.ini), so a missing option raises
# right through the handler -- and it raises inside Spark executor tasks, where
# it surfaces as KeyError: 'das_run_uuid' from every optimisation task at once.
#
# writer.py:171 also reads it straight out of os.environ to stamp the output
# header ("# DAS RUNID: ..."). Declaring it here satisfies both: entries in
# [environment] are exported to the process environment by
# config_apply_environment, which is what the "EXPORT ..." lines in the log are.
#
# In production das2020_driver.py:590 injects a uuid4 generated by
# dashboard.py:577. Here it comes from the environment so each launch is
# distinguishable in the output it stamps; env.sh defaults it to a UTC timestamp.
DAS_RUN_UUID: $DAS_RUN_UUID

# Take the academic Gurobi licence branch.
#
# optimizer.py:279 picks the licence path with
#
#     if (cluster == CC.EDU_CLUSTER) or (isv_name == ''):
#         env = gb.Env(logfile)                                   # academic
#     else:
#         env = gb.Env.OtherEnv(logfile, isv_name, app_name, env3, env4)
#
# and the shipped ipums_1940.ini declares [environment] grb_isv_name = Census,
# so neither test holds by default and the commercial/ISV branch is taken.
#
# That branch cannot run here for two independent reasons. We hold an academic
# node-locked licence, not the Bureau's ISV credentials -- and, more finally,
# `Env.OtherEnv` NO LONGER EXISTS in gurobipy 13:
#
#     AttributeError: type object 'Env' has no attribute 'OtherEnv'
#
# which is what killed the first Alaska run, inside every Spark optimisation
# task at once (alaska.log:3358, stage 101.0). So the release's own production
# licensing path is dead code against a current solver, independent of who runs
# it. das_constants.py:208 documents this switch as its remedy:
#
#     EDU_CLUSTER = 'EDU'   # if cluster_option=EDU use academic gurobi
#
# grb_isv_name is left exactly as published rather than blanked, so the
# deviation is this one line and the shipped value stays visible.
cluster: EDU


[engine]
# Skip reading the noisy measurements back from disk in the same run.
#
# This used to be a workaround. engine_utils.py:439 could not read them at all:
# the local branch of loadNoisyAnswers did parallelize(pickle.load(path)), which
# raises TypeError because pickle.load wants a file object and gets a path, and
# which could not have worked anyway -- savePickledRDD writes through
# rdd.saveAsPickleFile, producing a directory of Spark-pickled part files that
# only sparkContext.pickleFile can read. Production always uses s3:// or
# hdfs:// paths, so that branch was never exercised there.
#
# That branch is now fixed in this tree, so the option is no longer needed for
# correctness -- it is kept as a deliberate saving. The reload exists to free
# driver memory and truncate RDD lineage, and the noisy nodes are already
# persisted (topdown_engine.py:157), so skipping it cannot cause recomputation.
# save_noisy stays on, so the measurements are still written under
# $DAS_1940_OUTPUT/person/noisy_measurements.
#
# NOTE the asymmetry, which is why save_optimized must NOT be turned off in the
# same spirit: the optimized RDDs (topdown_engine.py:247) are never persisted,
# so there the write-and-reload IS the materialization barrier. Disabling it
# leaves parent_rdd on its lineage and the next action re-runs the geolevel's
# Gurobi solves, compounding down the hierarchy.
reload_noisy: False


[gurobi]
# Empty so the optimizer imports gurobipy from site-packages instead of
# prepending a hard-coded Gurobi install path (optimizer.py:102, :112).
gurobi_path:
gurobi_logfile_name: gurobi_1940.log
record_gurobi_stats: False
print_gurobi_stats: False

# The inherited value is $GUROBI_HOME/gurobi_client.lic. driver.py:180 walks
# every option in every section and raises if any $VARIABLE is undefined in the
# environment, so an unset GUROBI_HOME aborts the run during config validation
# -- before anything reads this option. Nothing does read it: das_constants.py:184
# defines the name and no code in this release consumes it (the only other
# mention, ctools/gurobi_chaos.py:23, is commented out). The licence actually
# used comes from GRB_LICENSE_FILE in the environment, which optimizer.py:224
# prefers over everything else. Overridden to a literal to satisfy validation.
gurobi_lic: /dev/null

# No Gurobi token server here; the licence is a local file.
#
# configs/default.ini sets TOKENSERVER=${GRB_TOKENSERVER} and
# PORT=${GRB_TOKENSERVER_PORT}, and optimizer.py:220-221 reads both
# unconditionally before deciding which licence to use. Expanding them raises
# KeyError inside every Spark optimisation task when those variables are not in
# the environment.
#
# Worth noting why this is not caught earlier: driver.py:164 validates with
# ([$][A-Za-z0-9_]+), which does not match the ${VAR} form at all, whereas
# ctools/paths.py:15 expands with (\$\{\w*\})|(\$\w*), which matches both. So
# config_validate is structurally blind to exactly these entries, and they can
# only fail at the point of use. preflight_config.py uses the paths.py pattern
# instead, deliberately stricter than the release's own validator.
#
# These values are never used on this path: optimizer.py:224 prefers
# GRB_LICENSE_FILE from the environment over everything else, and only falls back
# to writing a token-server .lic from these two options when that file is absent.
tokenserver: none
port: 0


[writer]
# Same situation as [gurobi] gurobi_lic above: the inherited default is
# $DAS_S3ROOT/rpc/upload (das_constants.py:970), which fails driver.py:180
# validation when DAS_S3ROOT is unset. No code in this release reads stats_dir
# -- das_constants.py:969 defines the name and nothing consumes it. Pointed at
# the local output directory so validation passes.
stats_dir: $DAS_1940_OUTPUT/stats

output_path: $DAS_1940_OUTPUT/person
output_datafile_name: person
produce_flag: 1
overwrite_flag: 1
# s3cat concatenates output parts through S3 tooling; off for local runs.
s3cat: 0
save_git_commit: 0


[error_metrics]
# The shipped error metrics cannot run on a 1940 spine, and this is a property
# of the metrics rather than a defect to fix.
#
# accuracy_metrics.AccuracyMetrics is written against the 2020 geography. Its
# answerQueriesUsingAnalysis (accuracy_metrics.py:593) aggregates to the
# geolevels OSE, Place, MCD, AIAN_AREAS and FED_AIRS and passes
# self.setup.grfc_path to sdftools.aggregateGeolevels. The GRFC is the 2020
# Census geographic reference collection, which maps blocks to those entities.
# There is no 1940 equivalent and there cannot be one -- the 1940 spine is
# Enumdist / Supdist / County / State / National.
#
# grfc_path is set to an obviously invalid placeholder here because a non-AIAN
# spine does not need it for setup or for the engine, and it does not. The
# metrics read it anyway, which is how the run ended:
#
#   AnalysisException: [PATH_NOT_FOUND] Path does not exist:
#     file:/nonexistent/grfc-unused-with-non_aian_spine
#
# reached AFTER the writer had finished, so the microdata was already on disk.
#
# Swapped for the no-op the release ships for this purpose. Two consequences
# worth knowing:
#
#   - Utility has to be measured outside the DAS, from the MDF output. For a
#     comparison against another system that is the right place to measure it
#     anyway, since both sides are then scored by the same code.
#   - It also removes the os.chdir(.../analysis) at accuracy_metrics.py:595,
#     whose matching os.chdir back (:612) is skipped when anything in between
#     raises. That left the process with a moved working directory, so the
#     DFXMLWriter atexit handler could not write its relative [logging]
#     logfolder path and reported a FileNotFoundError after the run was over.
#
# If the DAS's own metric groups are ever wanted, das_error_metrics.error_metrics
# is the one to try: it has zero references to 2020 geography and returns None
# when no metric_groups are configured.
error_metrics: programs.metrics.error_metrics_stub.ErrorMetricsStub


[validator]
results_fname: $DAS_1940_OUTPUT/RA_results


[takedown]
delete_output: False


[logging]
logfilename: DAS_1940_local
loglevel: INFO
logfolder: logs
dvs_enabled: 0
